name: CI

# Fast suite only: lint + unit tests. Agent evaluations (which consume Claude
# subscription usage) are run manually, not on every push -- see docs/evaluations.md.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: python -m pytest -q
