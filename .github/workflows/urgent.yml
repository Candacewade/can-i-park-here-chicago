name: Parking monitor (urgent poll)

# A once-daily cron is not enough for "urgent". This runs hourly, does a purely
# DETERMINISTIC evaluation of every active watch, and normally does nothing.
# It emails only when the rule engine reports a NEW urgent condition (a cause
# hash not already in the watch's `notified`). The Claude agent runs only for
# that one watch, only if a runtime token is configured. See docs/monitoring.md.
#
# Runtime user data lives in a separate PRIVATE repo (GH_DATA_TOKEN); nothing is
# written to this public repo. The repo is public, so Actions minutes are free.
#
# The cron fires at :09 rather than the top of the hour on purpose: GitHub's own
# docs warn that "high load times include the start of every hour" and that
# schedule delivery is more likely to be delayed right at :00. See
# docs/monitoring.md for the (much larger, multi-hour) delays actually observed
# on this repo and why a real fix needs an external trigger, not cron tuning.
on:
  schedule:
    - cron: "9 * * * *"     # hourly, offset from :00 to avoid top-of-hour load
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: parking-monitor     # shared with the daily workflow -> they serialize
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      GH_DATA_REPO: ${{ secrets.GH_DATA_REPO }}
      GH_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}
      WATCH_NOTIFY_MAP: ${{ secrets.WATCH_NOTIFY_MAP }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      - name: Urgent poll
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            npm install -g @anthropic-ai/claude-code
            python -m app.monitor --urgent-only
          else
            python -m app.monitor --urgent-only --no-agent
          fi
