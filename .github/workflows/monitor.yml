name: Parking monitor (daily)

# The daily morning pass: status summary, move reminders, and any urgent alert.
# Render Free has no cron, so this runs here. See docs/monitoring.md.
#
# All runtime user data (watches, resolved blocks, notify map) lives in a
# SEPARATE PRIVATE repo, written through the Contents API with GH_DATA_TOKEN.
# Nothing is written back to this public repo.
#
# When CLAUDE_CODE_OAUTH_TOKEN is set (from `claude setup-token` -- a
# subscription token, NOT an API key), the Claude agent composes the email;
# otherwise deterministic templates. Alerts still send either way.
on:
  schedule:
    - cron: "17 12 * * *"   # 12:17 UTC (~06:17-07:17 America/Chicago)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: parking-monitor          # shared with the hourly workflow -> they serialize
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GH_DATA_REPO: ${{ secrets.GH_DATA_REPO }}
      GH_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}
      WATCH_NOTIFY_MAP: ${{ secrets.WATCH_NOTIFY_MAP }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      - name: Run the daily pass
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Claude runtime token present -> agent-composed emails"
            npm install -g @anthropic-ai/claude-code
            python -m app.monitor
          else
            echo "No CLAUDE_CODE_OAUTH_TOKEN -> deterministic templates"
            python -m app.monitor --no-agent
          fi
